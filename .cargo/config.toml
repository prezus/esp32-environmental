[build]
target = "xtensa-esp32s3-espidf"

[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor"
# `espidf_time64` keeps `time_t` 64-bit, matching ESP-IDF >= 5.0 (avoids the 2038 problem).
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32s3"
# ESP-IDF version pulled and built by esp-idf-sys on the first compile.
ESP_IDF_VERSION = "v5.3.3"
